<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="64" height="64">
  <defs>
    <!-- Background Gradient (macOS Dark Slate) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242936"/>
      <stop offset="50%" stop-color="#161A22"/>
      <stop offset="100%" stop-color="#0D1017"/>
    </linearGradient>

    <!-- Squircle Border Highlight -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>

    <!-- AirPods White 3D Gloss Gradient -->
    <linearGradient id="podGloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F8FAFC"/>
      <stop offset="85%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <linearGradient id="podShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#64748B" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Chrome Contact Gradient -->
    <linearGradient id="chromeContact" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="35%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- ANC Soundwave Glow (Cyan / Electric Blue) -->
    <linearGradient id="waveGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#0071E3"/>
    </linearGradient>

    <!-- Ambient Shadow for AirPods -->
    <filter id="podDropShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0071E3" flood-opacity="0.2"/>
    </filter>

    <filter id="squircleShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- Clip Path for Squircle -->
    <clipPath id="squircleClip">
      <rect x="36" y="36" width="440" height="440" rx="104" ry="104"/>
    </clipPath>
  </defs>

  <!-- Squircle Base with Shadow -->
  <g filter="url(#squircleShadow)">
    <rect x="36" y="36" width="440" height="440" rx="104" ry="104" fill="url(#bgGrad)"/>
    <rect x="36" y="36" width="440" height="440" rx="104" ry="104" fill="none" stroke="url(#borderGrad)" stroke-width="2.5"/>
  </g>

  <!-- Inner Content Clipped to Squircle -->
  <g clip-path="url(#squircleClip)">
    <!-- Subtle Background Radial Glow for ANC -->
    <circle cx="256" cy="220" r="180" fill="#0071E3" opacity="0.12"/>
    <circle cx="256" cy="220" r="100" fill="#00D2FF" opacity="0.08"/>

    <!-- Concentric Noise Cancelling Soundwaves / Acoustic Rings -->
    <g opacity="0.28" fill="none" stroke="url(#waveGlow)" stroke-linecap="round">
      <circle cx="256" cy="235" r="90" stroke-width="2.5" stroke-dasharray="12 18"/>
      <circle cx="256" cy="235" r="130" stroke-width="2" stroke-dasharray="16 22"/>
      <circle cx="256" cy="235" r="170" stroke-width="1.5" stroke-dasharray="20 28"/>
    </g>

    <!-- Soundwave Active Bars (Mini Waveform at Bottom) -->
    <g transform="translate(186, 420)" fill="url(#waveGlow)" opacity="0.85">
      <rect x="0" y="8" width="5" height="14" rx="2.5"/>
      <rect x="14" y="2" width="5" height="26" rx="2.5"/>
      <rect x="28" y="10" width="5" height="10" rx="2.5"/>
      <rect x="42" y="0" width="5" height="30" rx="2.5"/>
      <rect x="56" y="5" width="5" height="20" rx="2.5"/>
      <rect x="70" y="11" width="5" height="8" rx="2.5"/>
      <rect x="84" y="3" width="5" height="24" rx="2.5"/>
      <rect x="98" y="7" width="5" height="16" rx="2.5"/>
      <rect x="112" y="12" width="5" height="6" rx="2.5"/>
      <rect x="126" y="4" width="5" height="22" rx="2.5"/>
      <rect x="140" y="9" width="5" height="12" rx="2.5"/>
    </g>

    <!-- AirPods 4 ANC Dual Earbuds Composition -->
    <g filter="url(#podDropShadow)">
      <!-- ================= LEFT AIRPOD ================= -->
      <g transform="translate(200, 240) rotate(-14) translate(-200, -240)">
        <!-- Stem -->
        <path d="M 172 205 L 172 342 C 172 348 175 354 182 354 C 189 354 192 348 192 342 L 192 215 Z" fill="url(#podGloss)"/>
        <!-- Stem Force Sensor indent -->
        <rect x="171" y="260" width="3" height="32" rx="1.5" fill="#CBD5E1" opacity="0.6"/>
        <!-- Bottom Chrome Ring -->
        <path d="M 172 336 L 172 342 C 172 348 175 354 182 354 C 189 354 192 348 192 342 L 192 336 Z" fill="url(#chromeContact)"/>
        <ellipse cx="182" cy="353" rx="4" ry="1.5" fill="#334155"/>
        
        <!-- Earbud Bulb / Head -->
        <path d="M 172 215 C 160 215 138 200 138 172 C 138 140 162 120 195 120 C 224 120 240 144 240 172 C 240 198 220 215 192 215 Z" fill="url(#podGloss)"/>
        
        <!-- Acoustic Mesh Grilles & Vents -->
        <!-- Main speaker oval mesh -->
        <ellipse cx="156" cy="170" rx="10" ry="18" fill="#1E293B" transform="rotate(-15 156 170)"/>
        <ellipse cx="156" cy="170" rx="8" ry="16" fill="#0F172A" transform="rotate(-15 156 170)"/>
        
        <!-- Back vent / microphone port -->
        <ellipse cx="224" cy="160" rx="5" ry="11" fill="#1E293B" transform="rotate(15 224 160)"/>
        <!-- Top vent -->
        <rect x="184" y="123" width="16" height="4" rx="2" fill="#334155"/>
      </g>

      <!-- ================= RIGHT AIRPOD ================= -->
      <g transform="translate(312, 240) rotate(14) translate(-312, -240)">
        <!-- Stem -->
        <path d="M 320 215 L 320 342 C 320 348 323 354 330 354 C 337 354 340 348 340 342 L 340 205 Z" fill="url(#podGloss)"/>
        <!-- Stem Force Sensor indent -->
        <rect x="338" y="260" width="3" height="32" rx="1.5" fill="#CBD5E1" opacity="0.6"/>
        <!-- Bottom Chrome Ring -->
        <path d="M 320 336 L 320 342 C 320 348 323 354 330 354 C 337 354 340 348 340 342 L 340 336 Z" fill="url(#chromeContact)"/>
        <ellipse cx="330" cy="353" rx="4" ry="1.5" fill="#334155"/>
        
        <!-- Earbud Bulb / Head -->
        <path d="M 320 215 C 292 215 272 198 272 172 C 272 144 288 120 317 120 C 350 120 374 140 374 172 C 374 200 352 215 340 215 Z" fill="url(#podGloss)"/>
        
        <!-- Acoustic Mesh Grilles & Vents -->
        <!-- Main speaker oval mesh -->
        <ellipse cx="356" cy="170" rx="10" ry="18" fill="#1E293B" transform="rotate(15 356 170)"/>
        <ellipse cx="356" cy="170" rx="8" ry="16" fill="#0F172A" transform="rotate(15 356 170)"/>
        
        <!-- Back vent / microphone port -->
        <ellipse cx="288" cy="160" rx="5" ry="11" fill="#1E293B" transform="rotate(-15 288 160)"/>
        <!-- Top vent -->
        <rect x="312" y="123" width="16" height="4" rx="2" fill="#334155"/>
      </g>
    </g>

    <!-- Glossy Top Corner Sheen -->
    <path d="M 36 140 C 36 80 80 36 140 36 L 372 36 C 432 36 476 80 476 140 C 376 170 140 190 36 140 Z" fill="#FFFFFF" opacity="0.04"/>
  </g>
</svg>
